
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="weather-container">

        <header>
            <h1>☀ WeatherNow</h1>
            <p>Check the weather anywhere in the world</p>
        </header>

        <div class="search-box">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
                autocomplete="off"
            >
            <button id="searchBtn">Search</button>
        </div>

        <p id="message" class="message"></p>

        <main id="weatherResult" class="weather-card hidden">

            <div class="location">
                <h2 id="cityName">Delhi</h2>
                <p id="countryName">India</p>
                <p id="localTime">Local time</p>
            </div>

            <div class="weather-main">
                <img id="weatherIcon" src="" alt="Weather icon">

                <h1>
                    <span id="temperature">--</span>°C
                </h1>

                <p id="weatherCondition">Weather condition</p>
            </div>

            <div class="weather-details">

                <div class="detail">
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <h3 id="feelsLike">--°C</h3>
                </div>

                <div class="detail">
                    <span>💧</span>
                    <p>Humidity</p>
                    <h3 id="humidity">--%</h3>
                </div>

                <div class="detail">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <h3 id="windSpeed">-- km/h</h3>
                </div>

                <div class="detail">
                    <span>☀️</span>
                    <p>UV Index</p>
                    <h3 id="uvIndex">--</h3>
                </div>

            </div>

            <p class="updated" id="lastUpdated"></p>

        </main>

        <footer>
            <p>Powered by WeatherAPI.com</p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
